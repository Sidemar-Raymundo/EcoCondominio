<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#0f391b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle circular glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Central Eco Icon Group with Filter -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Sprout Stem -->
    <path d="M 0 110 C 0 30 -20 -10 -60 -40 C -95 -65 -110 -110 -80 -140 C -45 -170 30 -140 40 -80 C 45 -40 20 20 0 110 Z" fill="url(#leafGrad)" />
    <!-- Secondary Sprout Leaf -->
    <path d="M 0 30 C 30 0 70 -10 100 -40 C 130 -70 120 -130 75 -130 C 35 -130 10 -70 0 30 Z" fill="url(#leafGrad2)" opacity="0.92" />
    <!-- Recycling Arch Ring -->
    <path d="M -120 70 A 140 140 0 0 1 120 70" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-dasharray="14 14" opacity="0.85" />
    <!-- Soil mound -->
    <ellipse cx="0" cy="118" rx="84" ry="18" fill="#14532d" />
    <!-- Home silhouette base representing Condomínio Vila di Lucca -->
    <path d="M -40 116 L -40 85 L 0 52 L 40 85 L 40 116 Z" fill="#ffffff" opacity="0.22" />
  </g>
</svg>
